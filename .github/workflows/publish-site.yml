name: Publish tracker website
on:
  push:
    branches: [main]
    paths: ['*.html', '*.js', '*.css', '*.svg', 'manifest.json', '.github/workflows/publish-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tracker-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test browser sync
        run: node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp index.html app.js sync.js data.js style.css service-worker.js manifest.json icon-192.svg icon-512.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
# Fresh-run trigger after a transient GitHub Pages deployment failure.
