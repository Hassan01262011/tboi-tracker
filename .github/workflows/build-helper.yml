name: Build TBOI Sync Helper

on:
  workflow_dispatch:
  push:
    paths:
      - "helper/**"
      - ".github/workflows/build-helper.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3 lupa==2.8

      - name: Test sync and exporter
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test tests/sync.test.cjs tests/edge.test.cjs

      - name: Build EXE
        run: >
          pyinstaller
          --onefile
          --add-data "helper/exporter:exporter"
          --console
          --name TBOISyncHelper
          helper/tboi_sync_helper.py

      - name: Verify packaged EXE
        run: ./dist/TBOISyncHelper.exe --self-test

      - name: Package setup files
        shell: pwsh
        run: |
          Copy-Item helper/Install.cmd,helper/Disable-Autostart.cmd,helper/START-HERE.txt dist/
          Compress-Archive -Path dist/* -DestinationPath TBOISyncHelper-Windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TBOISyncHelper-Windows
          path: dist/*

      - name: Publish stable public download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "sync-helper-latest"
          $asset = "TBOISyncHelper-Windows.zip"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "TBOI Sync Helper - Latest Windows Build" `
              --notes "Latest tested Windows helper for TBOI Tracker. Extract the ZIP and run Install.cmd with Isaac closed. The installer checks for REPENTOGON and offers to install the matching official dependency if needed."
          }
