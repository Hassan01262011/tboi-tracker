name: Build TBOI Sync Helper

on:
  workflow_dispatch:
  push:
    paths:
      - "helper/**"
      - ".github/workflows/build-helper.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: >
          pyinstaller
          --onefile
          --console
          --name TBOISyncHelper
          helper/tboi_sync_helper.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TBOISyncHelper-Windows
          path: dist/TBOISyncHelper.exe
